name: cms-lite-nette

services:
  app:
    build:
      context: docker/php
    user: "${CMS_UID:-1000}:${CMS_GID:-1000}"
    ports:
      - "${CMS_HTTP_PORT:-8080}:80"
    environment:
      NETTE_DEBUG: "${NETTE_DEBUG:-1}"
      CMS_DB_HOST: db
      CMS_DB_NAME: cms
      CMS_DB_USER: root
      CMS_DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  db:
    image: mysql:8.4
    ports:
      - "${CMS_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: cms
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  db-data:
